---
# Node-driven reconciliation plus an event-driven Pod labeler and a Node finalizer.
#
# 1. node_egress_provisioner: triggered by Node objects.
#    Only proxy Nodes are reconciled; the role itself skips everything
#    else and manages secondary ENI state plus per-node egress policy.
- version: v1
  group: ""
  kind: Node
  role: node_egress_provisioner
  reconcilePeriod: 30s
  finalizer:
    name: cxl.io/eni-cleanup
    role: node_egress_cleanup

# 2. pod_topology_labeler: triggered by Pod changes only. The role patches
#    scheduled Pods running on proxy nodes with the node-local gateway hash so
#    new Pods are labeled without a periodic resync loop.
- version: v1
  group: ""
  kind: Pod
  role: pod_topology_labeler

