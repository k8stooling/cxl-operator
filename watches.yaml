---
# Two steady-state reconciliation loops plus a CiliumNode finalizer.
#
# 1. node_egress_provisioner: triggered by CiliumNode objects (cilium.io/v2).
#    Only proxy CiliumNodes are reconciled; the role itself skips everything
#    else and manages secondary ENI state plus per-node egress policy.
- version: v2
  group: cilium.io
  kind: CiliumNode
  role: node_egress_provisioner
  reconcilePeriod: 30s
  finalizer:
    name: cxl.io/eni-cleanup
    role: node_egress_cleanup

# 2. pod_topology_labeler: triggered by Pod changes. The role patches
#    scheduled Pods running on proxy nodes with the node-local gateway hash so
#    exactly one CiliumEgressGatewayPolicy selects them.
- version: v1
  group: ""
  kind: Pod
  role: pod_topology_labeler
  reconcilePeriod: 15s
