{{- if .Values.kyvernoPolicyException.enabled }}
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: {{ include "cxl-operator.fullname" . }}-eni-init
  namespace: {{ include "cxl-operator.nodeInitializerNamespace" . }}
  annotations:
    # The exception must exist before Kyverno evaluates the operator Deployment
    # and the Jobs/Pods it creates.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "cxl-operator.labels" . | nindent 4 }}
spec:
  exceptions:
    - policyName: {{ .Values.kyvernoPolicyException.policyName | quote }}
      ruleNames:
        {{- range .Values.kyvernoPolicyException.ruleNames }}
        - {{ . | quote }}
        {{- end }}
  match:
    any:
      - resources:
          kinds:
            - Deployment
            - Job
            - Pod
          names:
            - {{ include "cxl-operator.fullname" . }}
            - {{ include "cxl-operator.fullname" . }}-*
            - cxl-eni-init-*
{{- end }}