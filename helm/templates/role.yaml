---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cxl-operator.fullname" . }}-manager
  labels:
    {{- include "cxl-operator.labels" . | nindent 4 }}
rules:
  # Base operator rules
  - apiGroups: [""]
    resources: [secrets, pods, pods/status, pods/exec, pods/log, nodes, nodes/finalizers, nodes/status]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: ["apps"]
    resources: [deployments, daemonsets, replicasets, statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  # CXL operator rules
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: ["cilium.io"]
    resources: [ciliumegressgatewaypolicies]
    verbs: [create, delete, get, list, watch, patch, update]
  {{- with .Values.extraClusterRoleRules }}
  {{ toYaml . | indent 2 }}
  {{- end }}
