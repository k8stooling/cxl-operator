apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cxl-operator.fullname" . }}
  labels:
    {{- include "cxl-operator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cxl-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cxl-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cxl-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          args:
            - --leader-elect
            - --leader-election-id=cxl-operator
            - --health-probe-bind-address=:6789
          env:
            - name: ANSIBLE_GATHERING
              value: explicit
            # CXL operator settings (mapped to role variable names by the
            # ansible-operator)
            - name: AWS_REGION
              value: {{ .Values.awsRegion | quote }}
            - name: SECONDARY_ENI_DEVICE_INDEX
              value: {{ .Values.secondaryEniDeviceIndex | quote }}
            - name: NODE_INITIALIZER_IMAGE
              value: {{ .Values.nodeInitializerImage | quote }}
            - name: NODE_INITIALIZER_JOB_NAMESPACE
              value: {{ .Values.nodeInitializerJobNamespace | default "" | quote }}
            - name: TARGET_SLICE_NAMESPACE
              value: {{ .Values.targetSliceNamespace | default "" | quote }}
            {{- if .Values.aws.secretName }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.secretName }}
                  key: {{ .Values.aws.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.secretName }}
                  key: {{ .Values.aws.secretAccessKeyKey }}
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.secretName }}
                  key: {{ .Values.aws.sessionTokenKey }}
                  optional: true
            {{- end }}
            - name: WATCH_NAMESPACE
              value: {{ .Values.watchNamespace | default "" | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: []
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
