# Default values for cxl-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/k8stooling/cxl-operator
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - "ALL"
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: 6789
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: 6789
  initialDelaySeconds: 5
  periodSeconds: 10

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# ---- CXL operator configuration ---------------------------------------------

# AWS region used for all EC2 ENI/VPC API calls.
awsRegion: "us-east-1"

# Device index the secondary ENI is attached at (0 is the primary ENI).
secondaryEniDeviceIndex: 1

# Optional Secret (in the operator's namespace) providing static AWS
# credentials. When empty, the operator relies on the IAM role / instance
# profile of the node it runs on.
aws:
  secretName: ""
  accessKeyIdKey: "AWS_ACCESS_KEY_ID"
  secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY"
  sessionTokenKey: "AWS_SESSION_TOKEN"

# Image for the privileged Bottlerocket node initializer Job. Must include
# iproute2 and curl; IMDSv2 assigns the secondary ENI IP.
nodeInitializerImage: "public.ecr.aws/amazonlinux/amazonlinux:2023"

# Namespace in which the node initializer Jobs are created.
# Empty = the operator's own namespace.
nodeInitializerJobNamespace: ""

# Optional Kyverno PolicyException allowing the dynamically created
# initializer Jobs to bypass the restricted policy bundle.
kyvernoPolicyException:
  enabled: true
  policyName: kyverno-policies-3.8.2
  ruleNames:
    - psp-restricted
    - autogen-psp-restricted

# Optional CIDR exclusions for the generated node-local egress policies.
# Defaults include the standard Kubernetes Service ClusterIP range.
# Systems-manage or another deploy path should append the cluster-specific
# service CIDR and any VPC-local CIDRs discovered from inventory.
egressPolicyDefaultExcludedCidrs:
  - 10.96.0.0/12
egressPolicyExcludedCidrs:
  - 172.20.0.0/16

# Namespaces the operator watches. Empty watches all namespaces.
watchNamespace: ""