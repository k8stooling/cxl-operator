---
# Example proxy workload Pod carrying the trigger label watched by the
# pod_topology_labeler role. Once scheduled, the operator will patch this Pod
# with cxl.io/egress-gw=<node-hash> to bind it to the correct node-local
# CiliumEgressGatewayPolicy.
apiVersion: v1
kind: Pod
metadata:
  name: haproxy-remote-eni
  labels:
    app.kubernetes.io/name: haproxy-remote-eni
    cxl.io/vpc-type: proxy
spec:
  restartPolicy: Always
  containers:
    - name: haproxy
      image: haproxy:3.1
      ports:
        - containerPort: 8080
          name: http