---
# Example NodePool labels and taint contract for nodes that should be managed
# by the cxl-operator. The operator watches CiliumNode resources created from
# these nodes and expects the subnet selector labels to be present.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: proxy-example
spec:
  template:
    metadata:
      labels:
        cxl.io/vpc-type: proxy
        cxl.io/subnet-tag-key: caas.io/nodepool
        cxl.io/subnet-key-value: proxy-example
    spec:
      taints:
        - key: cxl.io/egress-not-ready
          value: "true"
          effect: NoSchedule