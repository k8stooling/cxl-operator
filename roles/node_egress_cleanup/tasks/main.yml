---
- block:
    - name: Fetch the CiliumNode resource for cleanup
      kubernetes.core.k8s_info:
        api_version: cilium.io/v2
        kind: CiliumNode
        name: "{{ ansible_operator_meta.name }}"
      register: cilium_node_res

    - name: Set cleanup facts
      ansible.builtin.set_fact:
        cilium_node: "{{ cilium_node_res.resources[0] if cilium_node_res.resources | length > 0 else {} }}"
        cilium_node_name: >-
          {{
            (cilium_node_res.resources[0].spec.nodeName)
            if cilium_node_res.resources | length > 0 and (cilium_node_res.resources[0].spec.nodeName | default('')) | trim | length > 0
            else ansible_operator_meta.name
          }}

    - name: Fetch the Kubernetes Node backing the CiliumNode
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        name: "{{ cilium_node_name }}"
      register: k8s_node_res
      failed_when: false

    - name: Resolve cleanup state from the Node
      ansible.builtin.set_fact:
        k8s_node: "{{ k8s_node_res.resources[0] if k8s_node_res.resources | length > 0 else {} }}"
        secondary_eni_id: >-
          {{ ((k8s_node_res.resources[0].metadata.annotations | default({}))[secondary_eni_id_annotation] | default('')) if k8s_node_res.resources | length > 0 else '' }}
        egress_gateway_hash: >-
          {{ ((k8s_node_res.resources[0].metadata.labels | default({}))[egress_gateway_label_key] | default('')) if k8s_node_res.resources | length > 0 else '' }}

    - name: Fallback to the deterministic gateway hash
      ansible.builtin.set_fact:
        egress_gateway_hash: "{{ egress_gateway_hash if egress_gateway_hash | trim | length > 0 else (cilium_node_name | hash('sha1'))[:5] }}"

    - name: Fallback to ENI lookup by node tag
      amazon.aws.ec2_eni_info:
        region: "{{ aws_region }}"
        filters:
          "tag:{{ secondary_eni_tag_key }}": "{{ cilium_node_name }}"
      register: cleanup_eni_lookup
      when: secondary_eni_id | trim | length == 0

    - name: Set fallback ENI ID
      ansible.builtin.set_fact:
        secondary_eni_id: >-
          {{
            (cleanup_eni_lookup.network_interfaces | default(cleanup_eni_lookup.enis | default([])) | first).id
            if (cleanup_eni_lookup.network_interfaces | default(cleanup_eni_lookup.enis | default([])) | length) > 0
            else secondary_eni_id
          }}
      when: secondary_eni_id | trim | length == 0

    - name: Delete the node-local Cilium egress policy
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ egress_policy_api_version }}"
        kind: "{{ egress_policy_kind }}"
        name: "{{ egress_policy_name_prefix }}-{{ egress_gateway_hash }}"
      failed_when: false

    - name: Detach the ENI when present
      amazon.aws.ec2_eni:
        region: "{{ aws_region }}"
        eni_id: "{{ secondary_eni_id }}"
        attached: false
        force_detach: true
      when: secondary_eni_id | trim | length > 0

    - name: Wait for the ENI to become available before deletion
      amazon.aws.ec2_eni_info:
        region: "{{ aws_region }}"
        eni_id: "{{ secondary_eni_id }}"
      register: cleanup_eni_state
      retries: 10
      delay: 6
      until: >-
        (cleanup_eni_state.network_interfaces | default(cleanup_eni_state.enis | default([])) | length) == 0
        or
        (
          (cleanup_eni_state.network_interfaces | default(cleanup_eni_state.enis | default([])) | first).status
          | default('')
        ) == 'available'
      when: secondary_eni_id | trim | length > 0

    - name: Delete the ENI when present
      amazon.aws.ec2_eni:
        region: "{{ aws_region }}"
        eni_id: "{{ secondary_eni_id }}"
        state: absent
      when: secondary_eni_id | trim | length > 0

  rescue:
    - name: Fail the cleanup playbook
      ansible.builtin.fail:
        msg: "node_egress_cleanup playbook failed for CiliumNode {{ ansible_operator_meta.name }}. Check operator logs."