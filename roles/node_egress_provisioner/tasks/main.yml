---
- block:
    - name: Fetch the Kubernetes Node resource
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        name: "{{ ansible_operator_meta.name }}"
      register: node_res

    - name: Set Node fact
      ansible.builtin.set_fact:
        node_resource: "{{ node_res.resources[0] if node_res.resources | length > 0 else {} }}"

    - name: Extract the Kubernetes node name
      ansible.builtin.set_fact:
        cilium_node_name: "{{ node_resource.metadata.name | default(ansible_operator_meta.name) }}"

    - name: Skip nodes that are not in the proxy nodepool
      ansible.builtin.meta: end_host
      when: >-
        (node_resource.metadata.labels | default({})).get(
          nodepool_label_key | default(''), ''
        ) != nodepool_label_value

    - name: Validate Node provider ID
      ansible.builtin.fail:
        msg: "Node {{ cilium_node_name }} has no spec.providerID set"
      when: (node_resource.spec.providerID | default('') | trim | length) == 0

    - name: Set the EC2 instance ID from Node providerID
      ansible.builtin.set_fact:
        ec2_instance_id: >-
          {{ (node_resource.spec.providerID | regex_search('i-[0-9a-f]{8,17}')) | default('', true) }}

    - name: Validate parsed EC2 instance ID
      ansible.builtin.fail:
        msg: "Could not parse EC2 instance ID from spec.providerID '{{ node_resource.spec.providerID | default('') }}'"
      when: not ec2_instance_id is match('^i-0[0-9a-f]{8,17}$')

    - name: Set Node fact
      ansible.builtin.set_fact:
        k8s_node: "{{ node_resource }}"

    - name: Resolve the node-provided secondary subnet selector labels
      ansible.builtin.set_fact:
        node_vpc_id: >-
          {{
            (node_resource.metadata.labels | default({}))[vpc_id_label | default('')] | default('')
          }}
        node_security_groups_raw: >-
          {{
            (node_resource.metadata.labels | default({}))[security_group_label | default('')] | default('')
          }}
        node_subnet_tag_key: >-
          {{
            (node_resource.metadata.labels | default({}))[subnet_tag_key_label | default('')] | default('')
          }}
        node_subnet_tag_value: >-
          {{
            (node_resource.metadata.labels | default({}))[subnet_tag_value_label | default('')] | default('')
          }}
        node_subnet_ids_raw: >-
          {{
            (node_resource.metadata.labels | default({}))[subnet_ids_label | default('')] | default('')
          }}

    - name: Normalize the node-provided subnet ID list
      ansible.builtin.set_fact:
        node_secondary_subnet_id_list: >-
          {{ (node_subnet_ids_raw | default('')) | string | split(',') | map('trim') | select | list }}

    - name: Normalize the node-provided security-group list
      ansible.builtin.set_fact:
        node_security_groups: >-
          {{ (node_security_groups_raw | default('')) | string | split(',') | map('trim') | select | list }}

    - name: Ensure the proxy node defines VPC and security-group labels
      ansible.builtin.fail:
        msg: >-
          Node {{ cilium_node_name }} must provide both {{ vpc_id_label }} and
          {{ security_group_label }}.
      when: node_vpc_id | trim | length == 0 or node_security_groups | length == 0

    - name: Ensure exactly one node subnet selector source is configured
      ansible.builtin.fail:
        msg: >-
          Node {{ cilium_node_name }} must provide either both labels
          {{ subnet_tag_key_label }} and {{ subnet_tag_value_label }}, or the
          {{ subnet_ids_label }} label, but not both.
      when: >-
        (
          (node_subnet_tag_key | default('') | trim | length > 0)
          !=
          (node_subnet_tag_value | default('') | trim | length > 0)
        )
        or
        (
          (node_secondary_subnet_id_list | length > 0)
          and
          (node_subnet_tag_key | default('') | trim | length > 0)
        )
        or
        (
          (node_secondary_subnet_id_list | length == 0)
          and
          (node_subnet_tag_key | default('') | trim | length == 0)
        )

    - name: Check for existing ENI state
      ansible.builtin.set_fact:
        existing_secondary_eni_id: >-
          {{ (k8s_node.metadata.annotations | default({}))[secondary_eni_id_annotation | default('')] | default('') }}
        existing_secondary_eni_ip: >-
          {{ (k8s_node.metadata.annotations | default({}))[secondary_eni_annotation | default('')] | default('') }}

    - name: Look up the node EC2 instance
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        instance_ids:
          - "{{ ec2_instance_id }}"
      register: node_instance_info

    - name: Determine the node subnet and availability zone
      ansible.builtin.set_fact:
        node_subnet_id: "{{ (node_instance_info.instances[0].subnet_id | default('')) | trim }}"
        node_az: "{{ (node_instance_info.instances[0].placement.availability_zone | default('')) | trim }}"

    - name: Fail when the node subnet or availability zone could not be determined
      ansible.builtin.fail:
        msg: >-
          Could not determine the primary subnet or availability zone from
          Node {{ cilium_node_name }} / instance {{ ec2_instance_id }}.
      when: node_subnet_id | length == 0 or node_az | trim | length == 0

    - name: Look up the candidate secondary subnets by subnet IDs
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        subnet_ids: "{{ node_secondary_subnet_id_list }}"
      register: candidate_subnets_res
      when: node_secondary_subnet_id_list | length > 0

    - name: Look up the candidate secondary subnets by target VPC
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ node_vpc_id }}"
      register: candidate_subnets_res
      when: node_secondary_subnet_id_list | length == 0

    - name: Initialize the selected subnet fact
      ansible.builtin.set_fact:
        selected_subnet: {}

    - name: Select the candidate subnet matching the node availability zone
      ansible.builtin.set_fact:
        selected_subnet: "{{ item }}"
      loop: >-
        {{
          candidate_subnets_res.subnets | default([])
          | selectattr('vpc_id', 'equalto', node_vpc_id)
          | sort(attribute='subnet_id')
          | list
        }}
      loop_control:
        label: "{{ item.subnet_id | default('') }}"
      when:
        - selected_subnet.keys() | length == 0
        - (item.availability_zone | default('')) == node_az
        - ((item.tags | default({}))[node_subnet_tag_key] | default('')) == node_subnet_tag_value

    - name: Fail when no secondary subnet matches the node subnet selection
      ansible.builtin.fail:
        msg: >-
          No secondary subnet found for node {{ cilium_node_name }} in target VPC
          {{ node_vpc_id }} and availability zone {{ node_az }}
          using {{ subnet_ids_label }}={{ node_secondary_subnet_id_list | join(', ') }}
          or {{ subnet_tag_key_label }}={{ node_subnet_tag_key }}, {{ subnet_tag_value_label }}={{ node_subnet_tag_value }}.
      when: selected_subnet.keys() | length == 0

    - name: Look up an existing secondary ENI by node tag
      amazon.aws.ec2_eni_info:
        region: "{{ aws_region }}"
        filters:
          "tag:{{ secondary_eni_tag_key }}": "{{ cilium_node_name }}"
      register: eni_lookup

    - name: Set existing ENI fact
      ansible.builtin.set_fact:
        existing_eni: >-
          {{
            (eni_lookup.network_interfaces | default(eni_lookup.enis | default([])) | first)
            if (eni_lookup.network_interfaces | default(eni_lookup.enis | default([])) | length) > 0
            else {}
          }}

    - name: Build secondary ENI tag map
      ansible.builtin.set_fact:
        secondary_eni_tags: >-
          {{
            {
              (secondary_eni_tag_key): cilium_node_name,
              (secondary_eni_cilium_ignore_tag_key): secondary_eni_cilium_ignore_tag_value,
              'kubernetes.io/created-by': 'cxl-operator'
            }
          }}

    - name: Create and attach a new secondary ENI
      amazon.aws.ec2_eni:
        region: "{{ aws_region }}"
        subnet_id: "{{ selected_subnet.subnet_id }}"
        attached: true
        instance_id: "{{ ec2_instance_id }}"
        device_index: "{{ secondary_eni_device_index | int }}"
        name: "{{ secondary_eni_name_prefix }}-{{ cilium_node_name }}"
        description: "Managed by cxl-operator for {{ cilium_node_name }}"
        security_groups: "{{ node_security_groups }}"
        tags: "{{ secondary_eni_tags }}"
      register: eni_result
      when: existing_eni.keys() | length == 0

    - name: Enforce attachment termination behavior on an existing ENI
      amazon.aws.ec2_eni:
        region: "{{ aws_region }}"
        eni_id: "{{ existing_eni.id }}"
        instance_id: "{{ ec2_instance_id }}"
        attached: true
        device_index: "{{ secondary_eni_device_index | int }}"
        delete_on_termination: true
        security_groups: "{{ node_security_groups }}"
        tags: "{{ secondary_eni_tags }}"
      when: existing_eni.keys() | length > 0

    - name: Re-read the secondary ENI after create or reuse
      amazon.aws.ec2_eni_info:
        region: "{{ aws_region }}"
        eni_id: >-
          {{
            existing_eni.id
            if existing_eni.keys() | length > 0
            else (eni_result.interface.id | default(eni_result.id | default('')))
          }}
      register: resolved_eni_lookup

    - name: Set resolved ENI fact
      ansible.builtin.set_fact:
        resolved_eni: >-
          {{
            (resolved_eni_lookup.network_interfaces | default(resolved_eni_lookup.enis | default([])) | first)
            if (resolved_eni_lookup.network_interfaces | default(resolved_eni_lookup.enis | default([])) | length) > 0
            else existing_eni
          }}

    - name: Resolve the secondary ENI state
      ansible.builtin.set_fact:
        secondary_eni_id: >-
          {{
            existing_secondary_eni_id
            if existing_secondary_eni_id | trim | length > 0
            else (resolved_eni.id | default(eni_result.interface.id | default(eni_result.id | default(''))))
          }}
        secondary_eni_ip: >-
          {{
            existing_secondary_eni_ip
            if existing_secondary_eni_ip | trim | length > 0
            else (resolved_eni.private_ip_address | default(eni_result.interface.private_ip_address | default(eni_result.private_ip_address | default(''))))
          }}
        egress_gateway_hash: "{{ (cilium_node_name | hash('sha1'))[:5] }}"

    - name: Parse excluded CIDR lists
      ansible.builtin.set_fact:
        egress_policy_default_excluded_cidrs: >-
          {{
            (egress_policy_default_excluded_cidrs_raw | default('') | string)
            | split(',')
            | map('trim')
            | reject('equalto', '')
            | list
          }}

    - name: Combine excluded CIDR lists
      ansible.builtin.set_fact:
        egress_policy_excluded_cidrs: >-
          {{
            (
              (egress_policy_excluded_cidrs_raw | default('') | string)
              | split(',')
              | map('trim')
              | reject('equalto', '')
              | list
            )
            | union(egress_policy_default_excluded_cidrs)
          }}

    - name: Build dynamic Node metadata and selector maps
      ansible.builtin.set_fact:
        node_egress_annotations: >-
          {{
            {
              (secondary_eni_id_annotation): secondary_eni_id,
              (secondary_eni_annotation): secondary_eni_ip
            }
          }}
        node_egress_labels: >-
          {{
            {
              (egress_gateway_label_key): egress_gateway_hash
            }
          }}
        node_ready_labels: >-
          {{
            {
              (egress_gateway_label_key): egress_gateway_hash,
              (egress_gateway_ready_label_key): 'true'
            }
          }}
        egress_policy_match_labels: >-
          {{
            {
              (egress_gateway_label_key): egress_gateway_hash
            }
          }}

    - name: Build the policy selector set for the chosen routing model
      ansible.builtin.set_fact:
        egress_policy_selectors: >-
          {{
            [
              {
                'podSelector': {
                  'matchLabels': (
                    egress_policy_match_labels
                    if egress_routing_model == 'pod-label'
                    else {
                      (egress_routing_workload_label_key): egress_routing_workload_label_value
                    }
                  )
                }
              }
              | combine(
                  (
                    {
                      'nodeSelector': {
                        'matchLabels': {
                          'kubernetes.io/hostname': cilium_node_name
                        }
                      }
                    }
                  ) if egress_routing_model == 'static-workload-label' else {},
                  recursive=True
                )
            ]
          }}

    - name: Record ENI state and gateway hash on the Node
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: "{{ cilium_node_name }}"
            annotations: "{{ node_egress_annotations }}"
            labels: "{{ node_egress_labels }}"

    - name: Set the initializer Job name and namespace
      ansible.builtin.set_fact:
        node_initializer_job_name: >-
          {{ (egress_policy_name_prefix + '-' + egress_gateway_hash + '-init') | truncate(63, True, '') | trim('-') }}
        node_initializer_job_namespace: >-
          {{
            node_initializer_job_namespace
            if (node_initializer_job_namespace | default('') | trim) != ''
            else (lookup('env', 'POD_NAMESPACE') | default('', true))
          }}

    - name: Check for an existing initializer Job
      kubernetes.core.k8s_info:
        api_version: batch/v1
        kind: Job
        name: "{{ node_initializer_job_name }}"
        namespace: "{{ node_initializer_job_namespace }}"
      register: node_initializer_job_existing

    - name: Set initializer Job state facts
      ansible.builtin.set_fact:
        node_initializer_job_exists: "{{ (node_initializer_job_existing.resources | default([]) | length) > 0 }}"
        node_initializer_job_succeeded: >-
          {{
            ((node_initializer_job_existing.resources | default([]) | first).status.succeeded | default(0) | int) > 0
            if (node_initializer_job_existing.resources | default([]) | length) > 0
            else false
          }}
        node_initializer_job_failed: >-
          {{
            ((node_initializer_job_existing.resources | default([]) | first).status.failed | default(0) | int) > 0
            if (node_initializer_job_existing.resources | default([]) | length) > 0
            else false
          }}
        node_initializer_job_should_create: >-
          {{
            (node_initializer_job_existing.resources | default([]) | length) == 0
            or (
              ((node_initializer_job_existing.resources | default([]) | first).status.failed | default(0) | int) > 0
              and
              ((node_initializer_job_existing.resources | default([]) | first).status.succeeded | default(0) | int) == 0
            )
            if (node_initializer_job_existing.resources | default([]) | length) > 0
            else true
          }}

    - name: Delete a failed initializer Job before recreating it
      kubernetes.core.k8s:
        state: absent
        api_version: batch/v1
        kind: Job
        name: "{{ node_initializer_job_name }}"
        namespace: "{{ node_initializer_job_namespace }}"
      when:
        - node_initializer_job_exists
        - node_initializer_job_failed
        - not node_initializer_job_succeeded

    - name: Wait for the initializer Job to be deleted
      kubernetes.core.k8s_info:
        api_version: batch/v1
        kind: Job
        name: "{{ node_initializer_job_name }}"
        namespace: "{{ node_initializer_job_namespace }}"
      register: node_initializer_job_deleted
      retries: 20
      delay: 3
      until: (node_initializer_job_deleted.resources | default([]) | length) == 0
      when:
        - node_initializer_job_exists
        - node_initializer_job_failed
        - not node_initializer_job_succeeded

    - name: Apply the Node Initializer Job
      kubernetes.core.k8s:
        template: "templates/node_initializer_job.yaml"
        namespace: "{{ node_initializer_job_namespace }}"
      when: node_initializer_job_should_create

    - name: Wait for the initializer Job to succeed
      kubernetes.core.k8s_info:
        api_version: batch/v1
        kind: Job
        name: "{{ node_initializer_job_name }}"
        namespace: "{{ node_initializer_job_namespace }}"
      register: node_initializer_job_res
      retries: "{{ node_initializer_job_wait_retries | int }}"
      delay: "{{ node_initializer_job_wait_delay | int }}"
      until: >-
        (
          node_initializer_job_res.resources | default([]) | length
        ) > 0
        and
        (
          (
            (node_initializer_job_res.resources[0].status.succeeded | default(0) | int) > 0
          )
          or
          (
            (node_initializer_job_res.resources[0].status.failed | default(0) | int)
            >=
            (node_initializer_job_res.resources[0].spec.backoffLimit | default(0) | int)
            and
            (node_initializer_job_res.resources[0].status.failed | default(0) | int) > 0
          )
        )

    - name: Fail when the initializer Job did not succeed
      ansible.builtin.fail:
        msg: >-
          Initializer Job {{ node_initializer_job_namespace }}/{{ node_initializer_job_name }}
          failed for node {{ cilium_node_name }}.
      when: (node_initializer_job_res.resources[0].status.succeeded | default(0) | int) == 0

    - name: Apply the node-local Cilium egress policy
      kubernetes.core.k8s:
        api_version: "{{ egress_policy_api_version }}"
        kind: "{{ egress_policy_kind }}"
        definition:
          metadata:
            name: "{{ egress_policy_name_prefix }}-{{ egress_gateway_hash }}"
          spec:
            selectors: "{{ egress_policy_selectors }}"
            destinationCIDRs: "{{ egress_policy_destinations }}"
            excludedCIDRs: "{{ egress_policy_excluded_cidrs }}"
            egressGateway:
              nodeSelector:
                matchLabels: "{{ egress_policy_match_labels }}"
              egressIP: "{{ secondary_eni_ip }}"

    - name: Remove the egress readiness taint from the Node
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: Node
        name: "{{ cilium_node_name }}"
        definition:
          spec:
            taints: >-
              {{
                (k8s_node.spec.taints | default([]))
                | rejectattr('key', 'equalto', egress_gateway_ready_taint_key)
                | list
              }}

    - name: Mark the Node as egress-ready
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: "{{ cilium_node_name }}"
            labels: "{{ node_ready_labels }}"

    - name: Fetch pods scheduled to the proxy Node
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        field_selectors:
          - spec.nodeName={{ cilium_node_name }}
      register: node_pod_res
      when: egress_routing_model == 'pod-label'

    - name: Build the pod egress label patch
      ansible.builtin.set_fact:
        pod_egress_labels: "{{ { egress_gateway_label_key: egress_gateway_hash } }}"
      when: egress_routing_model == 'pod-label'

    - name: Label scheduled pods with the node-local egress hash
      kubernetes.core.k8s:
        api_version: v1
        kind: Pod
        state: patched
        definition:
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: "{{ item.metadata.namespace }}"
            labels: "{{ pod_egress_labels }}"
      loop: "{{ node_pod_res.resources | default([]) }}"
      when: >-
        egress_routing_model == 'pod-label'
        and
        (item.metadata.labels | default({}))[egress_gateway_label_key | default('')] | default('') != egress_gateway_hash

  rescue:
    - name: Fail the playbook so Kubernetes knows it failed
      ansible.builtin.fail:
        msg: "node_egress_provisioner playbook failed for Node {{ ansible_operator_meta.name }}."