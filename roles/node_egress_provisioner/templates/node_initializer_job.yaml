---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ node_initializer_job_name }}"
  namespace: "{{ node_initializer_job_namespace }}"
  labels:
    app.kubernetes.io/name: cxl-eni-init
    app.kubernetes.io/managed-by: cxl-operator
    cxl.io/egress-gw: "{{ egress_gateway_hash }}"
  annotations:
    cxl.k8stooling.io/node: "{{ cilium_node_name }}"
    cxl.k8stooling.io/secondary-eni-id: "{{ secondary_eni_id }}"
    cxl.k8stooling.io/secondary-eni-ip: "{{ secondary_eni_ip }}"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: {{ node_initializer_ttl_seconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cxl-eni-init
        app.kubernetes.io/managed-by: cxl-operator
        cxl.io/egress-gw: "{{ egress_gateway_hash }}"
    spec:
      hostNetwork: true
      hostPID: true
      restartPolicy: Never
      nodeName: "{{ cilium_node_name }}"
      tolerations:
        - operator: Exists
      containers:
        - name: eni-init
          image: "{{ node_initializer_image }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: ETH1_IP
              value: "{{ secondary_eni_ip }}"
            - name: ETH1_WAIT_SECONDS
              value: "{{ node_initializer_eth1_wait_seconds }}"
          command:
            - /bin/sh
            - -eu
            - -c
          args:
            - |
              set -eux

              ETH1_IP="${ETH1_IP:?ETH1_IP must be set}"
              WAIT="${ETH1_WAIT_SECONDS:-300}"

              i=0
              while [ ! -e /sys/class/net/eth1 ]; do
                i=$((i + 1))
                if [ "${i}" -ge "${WAIT}" ]; then
                  echo "ERROR: eth1 did not appear within ${WAIT}s" >&2
                  exit 1
                fi
                sleep 1
              done

              TOKEN=$(curl -s -f -X PUT "http://169.254.169.254/latest/api/token" \
                         -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
              MAC=$(cat /sys/class/net/eth1/address | tr -d ' \n')
              meta() {
                curl -s -f -H "X-aws-ec2-metadata-token: ${TOKEN}" \
                  "http://169.254.169.254/latest/meta-data/network/interfaces/macs/${MAC}/$1"
              }
              CIDR_BLOCK=$(meta subnet-ipv4-cidr-block)
              PREFIX_LEN="${CIDR_BLOCK#*/}"
              ETH1_GW=$(CIDR_BLOCK="${CIDR_BLOCK}" python3 -c 'import ipaddress, os; print(next(ipaddress.ip_network(os.environ["CIDR_BLOCK"], strict=False).hosts()))')
              
              echo "=== pre-change link state ==="
              ip -4 addr show || true
              echo "=== pre-change main routing table ==="
              ip route show || true
              echo "=== pre-change policy rules ==="
              ip rule show || true

              ip link set eth1 up
              ip addr replace "${ETH1_IP}/${PREFIX_LEN}" dev eth1

              ip route replace default via "${ETH1_GW}" dev eth1 table 100
              if ! ip rule show | grep -q "from ${ETH1_IP} lookup 100"; then
                ip rule add from "${ETH1_IP}" lookup 100
              fi
              if ! echo 1 > /proc/sys/net/ipv4/conf/eth1/arp_ignore; then
                echo "WARN: could not set arp_ignore on eth1" >&2
              fi
              if ! echo 2 > /proc/sys/net/ipv4/conf/eth1/arp_announce; then
                echo "WARN: could not set arp_announce on eth1" >&2
              fi

              echo "=== post-change eth1 state ==="
              ip -4 addr show eth1
              echo "=== post-change main routing table ==="
              ip route show
              echo "=== post-change table 100 ==="
              ip route show table 100
              echo "=== post-change policy rules ==="
              ip rule show
              echo "cxl node initialization complete for ${ETH1_IP} via ${ETH1_GW}"