---
# Only source Services carrying this label are reconciled by the sync roles.
trigger_label_key: "cxl.io/service"
trigger_label_value: "proxy"

# Label on the watched EndpointSlice pointing back to the source Service.
source_service_label_key: "kubernetes.io/service-name"

# Label marking the operator-managed target EndpointSlice.
managed_slice_label_key: "endpointslice.kubernetes.io/managed-by"
managed_slice_label_value: "cxl-operator"

# Annotation (written by the eni_provisioner role) holding the secondary
# ENI private IP on each Kubernetes Node.
secondary_eni_annotation: "network.infrastructure.io/secondary-eni-ip"

# Suffix used for the managed selectorless Service and EndpointSlice.
target_name_suffix: "-cxl"

# Optional overrides for the managed selectorless Service / EndpointSlice names.
target_slice_name: ""
# Namespace of the target slice. Defaults to the namespace of the triggered
# resource when left empty.
target_slice_namespace: ""
# Label identifying the selectorless Service backing the target slice.
target_slice_service_name: ""