---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  ##
  ## Base operator rules
  ##
  - apiGroups:
      - ""
    resources:
      - secrets
      - pods
      - pods/status
      - pods/exec
      - pods/log
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  ##
  ## CXL operator rules
  ##
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/finalizers
      - nodes/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - delete
      - patch
      - update
      - watch
  - apiGroups:
      - cilium.io
    resources:
      - ciliumegressgatewaypolicies
    verbs:
      - create
      - delete
      - get
      - list
      - watch
      - patch
      - update
# +kubebuilder:scaffold:rules
